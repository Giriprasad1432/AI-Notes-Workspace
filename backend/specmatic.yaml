version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/notesBackend"
    runOptions:
      $ref: "#/components/runOptions/notesBackend"
components:
  sources:
    localFilesystem:
      filesystem:
        directory: .
  services:
    notesBackend:
      description: "MERN AI Note Saver Express API"
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/localFilesystem"
            specs:
              - spec:
                  id: notesApiSpec
                  path: contracts/notes-api.yaml
      settings:
        schemaResiliencyTests: all
      data:
        examples:
          - directories:
              - contracts/notes-api_examples
  runOptions:
    notesBackend:
      openapi:
        type: test
        actuatorUrl: http://localhost:5000/actuator/mappings
        specs:
          - spec:
              id: notesApiSpec
