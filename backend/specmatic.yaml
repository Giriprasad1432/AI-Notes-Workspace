version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/notesBackend"
    runOptions:
      $ref: "#/components/runOptions/notesBackend"
components:
  sources:
    localFilesystem:
      filesystem:
        directory: .
  services:
    notesBackend:
      description: "MERN AI Note Saver Express API"
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/localFilesystem"
            specs:
              - spec:
                  id: notesApiSpec
                  path: contracts/notes-api.yaml
      # 🌟 FIXED: Kept dynamic environment hook variable for clean contract vs resiliency checks
      settings:
        schemaResiliencyTests: ${SPECMATIC_SCHEMA_RESILIENCY_TESTS:all}
      data:
        examples:
          - directories:
              - contracts/notes-api_examples
  runOptions:
    notesBackend:
      openapi:
        type: test
        actuatorUrl: http://localhost:5000/actuator/mappings
        specs:
          - spec:
              id: notesApiSpec

# Enforced strict 100% governance success parameters
specmatic:
  governance:
    report:
      formats:
        - html
      outputDirectory: build/reports/specmatic
    successCriteria:
      minCoveragePercentage: 100
      maxMissedOperationsInSpec: 0
      enforce: true
