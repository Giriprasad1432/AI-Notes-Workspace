openapi: 3.0.3
info:
  title: AI Note Saver API
  version: 1.0.0
security:
  - bearerAuth: []
paths:
  /api/add-note:
    post:
      summary: Create and process a new AI note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - content
              properties:
                title:
                  type: string
                  example: "Project Idea"
                content:
                  type: string
                  example: "Create an AI Note application."
      responses:
        '200':
          description: Note added successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Note added successfully"
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Validation Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
