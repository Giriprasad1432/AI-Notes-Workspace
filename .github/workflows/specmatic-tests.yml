name: Specmatic Contract Tests

on:
  push:
    branches: [ specmatic-review-submission ]
  pull_request:
    branches: [ specmatic-review-submission ]

jobs:
  specmatic-tests:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Create test user and get JWT token
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017/AI_NOTES_WORKSPACE_TEST
          JWT_SECRET: ci-test-secret-key-12345
          GROQ_API_KEY: test-key
        run: |
          TOKEN=$(node create_test_user.js | grep "JWT_TOKEN:" -A1 | tail -1)
          echo "bearerAuth=$TOKEN" >> $GITHUB_ENV

      - name: Start backend server
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017/AI_NOTES_WORKSPACE_TEST
          JWT_SECRET: ci-test-secret-key-12345
          GROQ_API_KEY: test-key
          PORT: 5000
        run: |
          node server.js &
          echo "Waiting for server to start..."
          sleep 5

      - name: Verify server is up
        run: |
          curl -s http://localhost:5000 || echo "Server is running (no root route is fine)"

      # Step 8A: Run Core Contract Tests Only (Outputs tests="3")
      - name: Run Core Contract Tests
        working-directory: backend
        run: |
          npx specmatic test --host=localhost --port=5000 --junitReportDir=build/reports/specmatic/contract
        env:
          bearerAuth: ${{ env.bearerAuth }}
          SPECMATIC_SCHEMA_RESILIENCY_TESTS: "none"

      # Step 8B: Upload Core Contract Report Artifact Logs Separately
      - name: Upload Contract Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-contract-reports
          path: backend/build/reports/specmatic/contract/

      # Step 9A: Run Schema Resiliency Fuzzing Tests Only (Outputs tests="25")
      - name: Run Schema Resiliency Fuzzing Tests
        working-directory: backend
        run: |
          npx specmatic test --host=localhost --port=5000 --junitReportDir=build/reports/specmatic/resiliency
        env:
          bearerAuth: ${{ env.bearerAuth }}
          SPECMATIC_SCHEMA_RESILIENCY_TESTS: "all"

      # Step 9B: Upload Resiliency Mutation Report Artifact Logs Separately
      - name: Upload Resiliency Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-resiliency-reports
          path: backend/build/reports/specmatic/resiliency/
