name: Specmatic Contract Tests

# When does this workflow run?
# - On every push to 'main' branch
# - On every pull request targeting 'main' branch
on:
  push:
    branches: [ specmatic-review-submission  ]
  pull_request:
    branches: [ specmatic-review-submission  ]

jobs:
  specmatic-tests:
    runs-on: ubuntu-latest

    # MongoDB service container — GitHub Actions spins up a real MongoDB instance
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      # Step 1: Check out the code from the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install Java (Specmatic needs Java to run)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 4: Install backend npm dependencies
      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      # Step 5: Create a test user and generate a JWT token dynamically in the cloud container
      # The token is needed because the API requires authentication and eliminates 401 leaks
      - name: Create test user and get JWT token
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017/AI_NOTES_WORKSPACE_TEST
          JWT_SECRET: ci-test-secret-key-12345
          GROQ_API_KEY: test-key
        run: |
          TOKEN=$(node create_test_user.js | grep "JWT_TOKEN:" -A1 | tail -1)
          echo "bearerAuth=$TOKEN" >> $GITHUB_ENV

      # Step 6: Start the Express backend server in the background
      - name: Start backend server
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017/AI_NOTES_WORKSPACE_TEST
          JWT_SECRET: ci-test-secret-key-12345
          GROQ_API_KEY: test-key
          PORT: 5000
        run: |
          node server.js &
          echo "Waiting for server to start..."
          sleep 5

      # Step 7: Verify the server is running
      - name: Verify server is up
        run: |
          curl -s http://localhost:5000 || echo "Server is running (no root route is fine)"

      # Step 8A: Run Core Contract Tests Only
      # 🚀 Uses the native filter flag to exclude negative mutation scenarios from this specific execution phase
      - name: Run Core Contract Tests
        working-directory: backend
        run: |
          npx specmatic test --host=localhost --port=5000 --junitReportDir=build/reports/specmatic/contract --filter="not resiliency"
        env:
          bearerAuth: ${{ env.bearerAuth }}

      # Step 8B: Upload Core Contract Report Artifact Logs Separately
      - name: Upload Contract Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-contract-reports
          path: backend/build/reports/specmatic/contract/

      # Step 9A: Run Schema Resiliency Fuzzing Tests Only
      # 🚀 Uses the native filter flag to isolate and execute only the mutation fuzzing scenarios
      - name: Run Schema Resiliency Fuzzing Tests
        working-directory: backend
        run: |
          npx specmatic test --host=localhost --port=5000 --junitReportDir=build/reports/specmatic/resiliency --filter="resiliency"
        env:
          bearerAuth: ${{ env.bearerAuth }}

      # Step 9B: Upload Resiliency Mutation Report Artifact Logs Separately
      - name: Upload Resiliency Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-resiliency-reports
          path: backend/build/reports/specmatic/resiliency/
